name: 로또 1등 당첨 판매점 자동 업데이트

on:
  schedule:
    # 매주 일요일 오전 8시 KST (토요일 23:00 UTC)
    # 토요일 추첨(~20:45 KST) 이후 충분한 시간 확보
    - cron: '0 23 * * 6'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-spots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 최신 1등 당첨 판매점 수집
        id: update
        run: |
          OUTPUT=$(node auto_update_spots.mjs)
          echo "$OUTPUT"
          ROUND=$(echo "$OUTPUT" | grep "UPDATED_ROUND=" | cut -d= -f2)
          echo "round=$ROUND" >> $GITHUB_OUTPUT

      - name: 변경 사항 확인
        id: check
        run: |
          if git diff --quiet data/luckySpots.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "변경 없음 — 업데이트할 새 데이터가 없습니다."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ROUND="${{ steps.update.outputs.round }}"
          git add data/luckySpots.ts
          git commit -m "[feat] 로또 1등 당첨 판매점 자동 업데이트 (${ROUND}회까지)"
          git push
